
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypt PDF - Free Online PDF Protector</title>
    <meta name="description" content="Free online encrypt PDF tool, add password protection to PDF, secure your files locally.">
    <meta name="keywords" content="encrypt PDF, password protect PDF, secure PDF">
    <link rel="canonical" href="https://www.tool-pdf.top/pdf-encrypt.html">
    <link rel="stylesheet" href="/css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2923288635448337" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<div id="header-placeholder"></div>
<div class="ad-container top-ad" style="text-align:center; margin:20px 0;">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2923288635448337" data-ad-slot="1000000001" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
<main class="container" style="text-align:center; max-width:768px; margin:0 auto; padding:0 15px;">
    <h1>Encrypt PDF - Add Password Protection</h1>
    <p>Secure your PDF with password, prevent unauthorized access, local processing only.</p>
    <div class="upload-box" style="margin:30px 0;">
        <label class="upload-btn" for="pdfFile">Select PDF File</label>
        <input type="file" id="pdfFile" accept=".pdf" hidden>
    </div>
    <div style="margin:15px 0;"><input type="password" id="pwd" placeholder="Set password" style="padding:8px; width:220px;"></div>
    <div class="action-box" style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="upload-btn" id="encryptBtn" disabled>Encrypt PDF</button>
        <button class="upload-btn" onclick="clearFile()">Reset</button>
    </div>
    <div id="loading" style="display:none; margin:20px 0;">Processing...</div>
    <div class="result-box" style="margin:20px 0;"></div>
    <div class="ad-container middle-ad" style="text-align:center; margin:30px 0;">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2923288635448337" data-ad-slot="1000000002" data-ad-format="fluid" data-ad-layout="in-article"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</main>
<div id="footer-placeholder"></div>
<script>
fetch("/header.html").then(r=>r.text()).then(d=>document.getElementById("header-placeholder").innerHTML=d);
fetch("/footer.html").then(r=>r.text()).then(d=>document.getElementById("footer-placeholder").innerHTML=d);
let currentFile=null;
const fileInput=document.getElementById('pdfFile');const pwd=document.getElementById('pwd');
const encryptBtn=document.getElementById('encryptBtn');const loading=document.getElementById('loading');
const resultBox=document.querySelector('.result-box');
fileInput.addEventListener('change',e=>{currentFile=e.target.files[0];encryptBtn.disabled=!currentFile;});
encryptBtn.onclick=async()=>{
    if(!pwd.value){alert('Please enter password');return;}
    encryptBtn.disabled=true;loading.style.display='block';resultBox.innerHTML='';
    try{
        const doc=await PDFLib.PDFDocument.load(await currentFile.arrayBuffer());
        const bytes=await doc.save({encryptPassword:pwd.value});
        const blob=new Blob([bytes],{type:'application/pdf'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Encrypted.pdf';a.click();
        resultBox.innerHTML='<p style="color:green">PDF encrypted successfully!</p>';
    }catch(e){alert('Error: '+e.message);}finally{loading.style.display='none';encryptBtn.disabled=false;}
};
function clearFile(){fileInput.value='';pwd.value='';currentFile=null;encryptBtn.disabled=true;resultBox.innerHTML='';}
</script>
</body>
</html>
