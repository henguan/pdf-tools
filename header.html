<!-- 2. 翻译脚本放 </body> 前，用国内可访问的 CDN+错误降级 -->
<script>
function loadGoogleTranslate() {
  try {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'zh-CN,zh-TW,en,es,fr,de,ja,ko,ru,pt',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'gtranslate_wrapper');
  } catch (e) {
    // 国内加载失败时提示
    document.getElementById('gtranslate_wrapper').innerHTML = 
      '<span style="color:red;font-size:12px;">翻译加载失败（国内网络限制）</span>';
  }
}
</script>
<!-- 优先用备用 CDN -->
<script src="https://cdn.jsdelivr.net/npm/google-translate-element@1.0.0/translate_a/element.js?cb=loadGoogleTranslate"></script>
<!-- 备用：原生地址（国内大概率403） -->
<script src="https://translate.google.com/translate_a/element.js?cb=loadGoogleTranslate" onerror="document.getElementById('gtranslate_wrapper').innerHTML='<span style=color:red;font-size:12px>翻译服务不可用</span>'"></script>

</body>
</html>
