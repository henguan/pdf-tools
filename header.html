    <!-- 引入独立的CSS样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="container">
        <a class="logo" href="index.html">
            <img src="/i/adobe-pdf-icon.svg" alt="Logo">
            <span>PDF</span>
        </a>

        <nav class="nav-menu">
            <a href="index.html">Home</a>

            <div class="dropdown">
                <span>Tools ▾</span>
                <div class="dropdown-menu">
                    <a href="compress.html">COMPRESS</a>
                    <a href="jpg2pdf.html">JPG to PDF</a>
                    <a href="png2pdf.html">PNG to PDF</a>
                    <a href="split.html">SPLIT</a>

            <a href="help.html">Help</a>
            <a href="about.html">About</a>

            <!-- 多语言切换 -->
            <select id="langSwitch" class="lang-select">
                <option value="en">English</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="ru">Русский</option>
                <option value="pt">Português</option>
            </select>
        </nav>
    </div>
</header>

<!-- 多语言核心脚本 -->
<script>
    // 切换语言
    document.getElementById('langSwitch').addEventListener('change', function () {
        const lang = this.value;
        document.cookie = `googtrans=/en/${lang}; path=/; max-age=31536000`;
        location.reload();
    });

    // 加载翻译
    function loadGoogleTranslate() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'zh-CN,zh-TW,en,es,fr,de,ja,ko,ru,pt',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'gtranslate_wrapper');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=loadGoogleTranslate"></script>

</body>
</html>
