<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Page Numbers to PDF - Free Online Tool</title>
    <meta name="description" content="Free online add page numbers to PDF tool, insert page numbers easily, local processing, no watermark.">
    <meta name="keywords" content="add page numbers to PDF, PDF page numbering">
    <link rel="canonical" href="https://www.tool-pdf.top/pdf-add-page-number.html">
    <link rel="stylesheet" href="/css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2923288635448337" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<div id="header-placeholder"></div>
<div class="ad-container top-ad" style="text-align:center; margin:20px 0;">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2923288635448337" data-ad-slot="1000000001" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
<main class="container" style="text-align:center; max-width:768px; margin:0 auto; padding:0 15px;">
    <h1>Add Page Numbers to PDF</h1>
    <p>Insert page numbers to PDF quickly, local processing, safe and simple.</p>
    <div class="upload-box" style="margin:30px 0;">
        <label class="upload-btn" for="pdfFile">Select PDF File</label>
        <input type="file" id="pdfFile" accept=".pdf" hidden>
    </div>
    <div class="action-box" style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="upload-btn" id="addBtn" disabled>Add Page Numbers</button>
        <button class="upload-btn" onclick="clearFile()">Reset</button>
    </div>
    <div id="loading" style="display:none; margin:20px 0;">Processing...</div>
    <div class="result-box" style="margin:20px 0;"></div>
    <div class="ad-container middle-ad" style="text-align:center; margin:30px 0;">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2923288635448337" data-ad-slot="1000000002" data-ad-format="fluid" data-ad-layout="in-article"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</main>
<div id="footer-placeholder"></div>
<script>
fetch("/header.html").then(r=>r.text()).then(d=>document.getElementById("header-placeholder").innerHTML=d);
fetch("/footer.html").then(r=>r.text()).then(d=>document.getElementById("footer-placeholder").innerHTML=d);
let currentFile=null;
const fileInput=document.getElementById('pdfFile');const addBtn=document.getElementById('addBtn');
const loading=document.getElementById('loading');const resultBox=document.querySelector('.result-box');
fileInput.addEventListener('change',e=>{currentFile=e.target.files[0];addBtn.disabled=!currentFile;});
addBtn.onclick=async()=>{
    addBtn.disabled=true;loading.style.display='block';resultBox.innerHTML='';
    try{
        const doc=await PDFLib.PDFDocument.load(await currentFile.arrayBuffer());
        const pages=doc.getPages();
        pages.forEach((p,i)=>{p.drawText(`Page ${i+1}`,{x:p.getWidth()/2-20,y:20,size:12});});
        const bytes=await doc.save();const blob=new Blob([bytes],{type:'application/pdf'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Numbered.pdf';a.click();
        resultBox.innerHTML='<p style="color:green">Page numbers added!</p>';
    }catch(e){alert('Error: '+e.message);}finally{loading.style.display='none';addBtn.disabled=false;}
};
function clearFile(){fileInput.value='';currentFile=null;addBtn.disabled=true;resultBox.innerHTML='';}
</script>
</body>
</html>
