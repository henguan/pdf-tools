<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG转PDF - 免费在线多张图片合成PDF工具</title>
    <meta name="description" content="免费JPG转PDF在线工具，支持多张JPG批量合成PDF，本地浏览器处理，不上传文件，安全无水印。">
    <meta name="keywords" content="JPG转PDF,图片转PDF,多张JPG合成PDF">
    <link rel="canonical" href="https://www.tool-pdf.top/jpg2pdf.html">
    <link rel="stylesheet" href="/css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2923288635448337" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        .container {width: 1200px; margin: 0 auto;}
        @media (max-width: 1200px) {.container {width: 95%;}}
        .upload-box{border:2px dashed #ccc; padding:40px; text-align:center; border-radius:8px; margin:20px 0;}
        .upload-btn{background:#2563eb; color:#fff; padding:10px 20px; border-radius:6px; cursor:pointer; display:inline-block;}
        .preview-box{display:grid; grid-template-columns:repeat(auto-fill,120px); gap:10px; margin:20px 0;}
        .preview-img{width:100px; height:auto; border:1px solid #eee; cursor:pointer;}
    </style>
</head>
<body>
<header class="navbar">
    <div class="container">
        <div class="logo">
            <img src="https://via.placeholder.com/40" alt="JPG转PDF">
            <span>JPG转PDF工具</span>
        </div>
        <nav class="nav-menu">
            <a href="index.html">首页</a>
            <a href="jpg2pdf.html" class="active">JPG转PDF</a>
            <a href="png2pdf.html">PNG转PDF</a>
        </nav>
    </div>
</header>

<div class="ad-container" style="text-align:center; margin:20px 0;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-2923288635448337"
         data-ad-slot="1000000001"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<main class="container">
    <h1>JPG转PDF - 免费批量合成PDF</h1>
    <p>选择多张JPG图片，一键生成标准A4 PDF，本地处理不上传，保护隐私。</p>

    <div class="upload-box">
        <label class="upload-btn" for="jpgFile">选择JPG图片</label>
        <input type="file" id="jpgFile" accept="image/jpeg,image/jpg" multiple hidden>
        <p>支持多选多张JPG，自动分页合成PDF</p>
    </div>

    <div class="preview-box" id="jpgPreview"></div>
    <div class="action-box"></div>
    <div class="result-box"></div>
</main>

<footer class="footer">
    <div class="container">
        <a href="index.html">返回首页</a>
        <div class="copyright">© 2025 免费JPG转PDF工具</div>
    </div>
</footer>

<script>
const { jsPDF } = window.jspdf;
let selectedFiles = [];

function previewImages(files){
    selectedFiles = Array.from(files);
    const box = document.getElementById('jpgPreview');
    box.innerHTML = '';
    selectedFiles.forEach((file,i)=>{
        let url = URL.createObjectURL(file);
        let div = document.createElement('div');
        div.innerHTML = `<img src="${url}" class="preview-img"><div>第${i+1}页</div>`;
        box.appendChild(div);
    });
    document.querySelector('.action-box').innerHTML = '<button class="upload-btn" onclick="exportToPdf()">立即生成PDF</button>';
}

function exportToPdf(){
    if(selectedFiles.length === 0){
        document.querySelector('.result-box').innerHTML = '<p style="color:red">请先选择图片</p>';
        return;
    }
    document.querySelector('.result-box').innerHTML = '<p style="color:#2563eb">正在生成PDF...</p>';
    let pdf = new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    let promiseArr = [];
    selectedFiles.forEach(file=>{
        promiseArr.push(new Promise(res=>{
            let img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = ()=>res(img);
        }));
    });
    Promise.all(promiseArr).then(imgs=>{
        imgs.forEach((img,idx)=>{
            if(idx>0) pdf.addPage();
            let a4W=210,a4H=297;
            let ratio = Math.min(a4W/img.width, a4H/img.height);
            let w = img.width*ratio;
            let h = img.height*ratio;
            let x = (a4W-w)/2;
            let y = (a4H-h)/2;
            pdf.addImage(img,'JPEG',x,y,w,h);
        });
        pdf.save('JPG转PDF文档.pdf');
        document.querySelector('.result-box').innerHTML = '<p style="color:green">PDF下载已开始！</p>';
    });
}

document.getElementById('jpgFile').addEventListener('change',e=>{
    previewImages(e.target.files);
});
</script>
</body>
</html>
