<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG转PDF - 免费在线多张JPG图片合成PDF工具</title>
    <meta name="description" content="免费在线JPG转PDF工具，支持多张JPG图片一键合成PDF，纯浏览器本地处理，文件不上传更安全。">
    <meta name="keywords" content="JPG转PDF,JPG图片转PDF,多张JPG合成PDF">
    <link rel="canonical" href="https://www.tool-pdf.top/jpg2pdf.html">
    <link rel="stylesheet" href="/css/style.css">

    <!-- AdSense -->
    <script async src="https://pagead2.goegogle.com/pagead/js/adsbygoogle.js?client=ca-pub-2923288635448337" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

    <!-- 公共页头 -->
    <div id="header-placeholder"></div>

    <!-- 顶部广告 -->
    <div class="ad-container top-ad" style="text-align:center; margin:20px 0;">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2923288635448337"
             data-ad-slot="1000000001"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <main class="container">
        <section class="tool-section">
            <h1>JPG转PDF - 免费批量合成PDF工具</h1>

            <div class="upload-box">
                <label class="upload-btn" for="jpgFile">选择JPG图片文件</label>
                <input type="file" id="jpgFile" accept="image/jpeg,image/jpg" multiple hidden>
                <p>支持批量多张JPG图片，自动分页合成PDF</p>
            </div>

            <div class="preview-box" id="jpgPreview"></div>
            <div class="action-box"></div>
            <div class="result-box"></div>
        </section>

        <!-- 中间广告 -->
        <div class="ad-container middle-ad" style="text-align:center; margin:30px 0;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-2923288635448337"
                 data-ad-slot="1000000002"
                 data-ad-format="fluid"
                 data-ad-layout="in-article"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <section class="intro-section">
            <h2>工具介绍</h2>
            <p>本JPG转PDF工具完全在浏览器本地运行，图片文件不会上传到服务器，严格保护您的隐私安全。</p>
            <p>支持多张JPG图片一键合成PDF，操作简单，无需安装任何软件。</p>
        </section>

        <section class="faq-section">
            <h2>常见问题</h2>
            <div class="faq-item">
                <h3>图片会泄露吗？</h3>
                <p>安全，所有转换都在本地浏览器完成，不上传、不存档。</p>
            </div>
            <div class="faq-item">
                <h3>支持多张图片合并吗？</h3>
                <p>支持，可一次性选择多张JPG图片合成一个PDF文件。</p>
            </div>
        </section>
    </main>

    <!-- 公共页脚 -->
    <div id="footer-placeholder"></div>

    <script>
        // 自动加载公共页头、页脚
        fetch("/header.html")
            .then(res => res.text())
            .then(data => document.getElementById("header-placeholder").innerHTML = data);

        fetch("/footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer-placeholder").innerHTML = data);

        // 原有功能逻辑 完全不变
        const { jsPDF } = window.jspdf;
        let selectedFiles = [];

        document.getElementById('jpgFile').addEventListener('change', function(e){
            selectedFiles = Array.from(e.target.files);
            const box = document.getElementById('jpgPreview');
            box.innerHTML = '';

            selectedFiles.forEach((file, i) => {
                let url = URL.createObjectURL(file);
                let wrap = document.createElement('div');
                wrap.className = 'thumbnail-wrap';
                wrap.innerHTML = `<img src="${url}" class="preview-img"><span class="page-number">${i+1}</span>`;
                box.appendChild(wrap);
            });

            document.querySelector('.action-box').innerHTML = `
            <button class="upload-btn" onclick="exportToPdf()">立即合成并下载PDF</button>
            `;
        });

        function exportToPdf(){
            if(selectedFiles.length === 0){
                document.querySelector('.result-box').innerHTML = '<p style="color:red">请先选择图片</p>';
                return;
            }

            document.querySelector('.result-box').innerHTML = '<p style="color:#2563eb">正在生成PDF，请稍候...</p>';

            let pdf = new jsPDF({
                orientation: 'p',
                unit: 'mm',
                format: 'a4'
            });

            let promises = selectedFiles.map(file => {
                return new Promise(resolve => {
                    let img = new Image();
                    img.src = URL.createObjectURL(file);
                    img.onload = () => resolve(img);
                });
            });

            Promise.all(promises).then(imgs => {
                imgs.forEach((img, idx) => {
                    if(idx > 0) pdf.addPage();
                    let a4W = 210, a4H = 297;
                    let ratio = Math.min(a4W / img.width, a4H / img.height);
                    let w = img.width * ratio;
                    let h = img.height * ratio;
                    let x = (a4W - w) / 2;
                    let y = (a4H - h) / 2;
                    pdf.addImage(img, 'JPEG', x, y, w, h);
                });
                pdf.save('JPG转PDF.pdf');
                document.querySelector('.result-box').innerHTML = '<p style="color:green">PDF已生成，自动开始下载！</p>';
            });
        }
    </script>

</body>
</html>
