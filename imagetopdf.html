<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF - Convert Images to PDF Online Free</title>
    <meta name="description" content="Free online Image to PDF converter. Convert JPG, PNG to PDF easily in browser.">
    <link rel="canonical" href="https://www.tool-pdf.top/jpg2pdf.html">
    <link rel="stylesheet" href="/css/style.css">

    <!-- AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2923288635448337" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>

    <!-- 自动加载页头 -->
    <div id="header-placeholder"></div>

    <!-- 顶部广告 -->
    <div class="ad-container" style="text-align:center; margin:20px 0;">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2923288635448337"
             data-ad-slot="1000000001"
             data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <main class="container">
        <section class="tool-section">
            <h1>Image to PDF - Free Online Converter</h1>
            <div class="upload-box">
                <label class="upload-btn" for="imgFile">Select Images</label>
                <input type="file" id="imgFile" accept="image/*" multiple hidden>
                <p>Support JPG, PNG, WEBP, BMP, etc.</p>
            </div>

            <div class="preview-box" id="imgPreview"></div>
            <div class="action-box"></div>
            <div class="result-box"></div>
        </section>
    </main>

    <!-- 自动加载页脚 -->
    <div id="footer-placeholder"></div>

    <script>
        // 加载页头
        fetch("header.html")
            .then(res => res.text())
            .then(data => document.getElementById("header-placeholder").innerHTML = data);

        // 加载页脚
        fetch("footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer-placeholder").innerHTML = data);
    </script>

    <script>
        const { jsPDF } = window.jspdf;
        let selectedFiles = [];

        document.getElementById("imgFile").addEventListener("change", function (e) {
            selectedFiles = Array.from(e.target.files);
            const box = document.getElementById("imgPreview");
            box.innerHTML = "";

            selectedFiles.forEach((file, i) => {
                let url = URL.createObjectURL(file);
                let div = document.createElement("div");
                div.innerHTML = `<img src="${url}" class="preview-img"><div>Page ${i+1}</div>`;
                box.appendChild(div);
            });

            document.querySelector(".action-box").innerHTML = `<button class="upload-btn" onclick="exportPDF()">Convert to PDF</button>`;
        });

        function exportPDF() {
            if (!selectedFiles.length) { alert("Please select images"); return; }
            let pdf = new jsPDF("p", "mm", "a4");
            let count = 0;

            selectedFiles.forEach((file, idx) => {
                let img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = function () {
                    if (idx > 0) pdf.addPage();
                    let w = 210, h = 297;
                    let r = Math.min(w / img.width, h / img.height);
                    pdf.addImage(img, "JPEG", (w - img.width * r) / 2, (h - img.height * r) / 2, img.width * r, img.height * r);
                    count++;
                    if (count === selectedFiles.length) {
                        pdf.save("Image-to-PDF.pdf");
                        document.querySelector(".result-box").innerHTML = `<p style='color:green'>PDF downloaded!</p>`;
                    }
                };
            });
        }
    </script>

</body>
</html>
